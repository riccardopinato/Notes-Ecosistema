name: Web Workspace Quality

on:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/web-workspace-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/web-workspace-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notes-web-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Resolve locked dependencies
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze Flutter
        run: flutter analyze --no-pub
      - name: Run Flutter tests
        run: flutter test --no-pub
      - name: Build Web release
        run: |
          flutter create --platforms=web --org it.notes.ecosystem --project-name notes_ecosistema --no-pub /tmp/notes-web-shell
          rm -rf web
          cp -R /tmp/notes-web-shell/web ./web
          flutter build web --release --no-pub --target lib/web_preview.dart --base-href "/Notes-Ecosistema/"
