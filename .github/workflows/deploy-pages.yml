name: Deploy Web Preview

on:
  push:
    branches: [main]
    paths:
      - "flutter_app/**"
      - ".github/workflows/deploy-pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "flutter_app/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notes-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Create web shell
        run: |
          rm -rf /tmp/notes_web
          flutter create --platforms=web --org it.notes.ecosystem --project-name notes_ecosistema --no-pub /tmp/notes_web
          rm -rf web
          cp -R /tmp/notes_web/web ./web

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build web preview
        run: >
          flutter build web --release --no-pub
          --target lib/web_preview.dart
          --base-href "/Notes-Ecosistema/"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: flutter_app/build/web

  deploy:
    # The connected GitHub App cannot enable Pages for this repository.
    # Set repository variable ENABLE_PAGES=true after Pages is enabled in GitHub.
    if: github.event_name != 'pull_request' && vars.ENABLE_PAGES == 'true'
    needs: build-web
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
