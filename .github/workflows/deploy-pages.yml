name: Deploy Web Preview

on:
  push:
    branches: [main]
    paths:
      - "flutter_app/**"
      - ".github/workflows/deploy-pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "flutter_app/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: notes-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create web shell
        run: |
          rm -rf /tmp/notes_web
          flutter create --platforms=web --org it.notes.ecosystem --project-name notes_ecosistema --no-pub /tmp/notes_web
          rm -rf web
          cp -R /tmp/notes_web/web ./web

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build web preview
        run: >
          flutter build web --release --no-pub
          --target lib/web_preview.dart
          --base-href "/Notes-Ecosistema/"

      - name: Disable stale Flutter web cache
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          bootstrap = Path("build/web/flutter_bootstrap.js")
          text = bootstrap.read_text(encoding="utf-8")
          text, count = re.subn(
              r'_flutter\.loader\.load\(\{\s*serviceWorkerSettings:\s*\{.*?\}\s*\}\);',
              '_flutter.loader.load();',
              text,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("Unexpected Flutter bootstrap service worker shape")
          sha = os.environ["BUILD_SHA"][:12]
          text = text.replace(
              '"mainJsPath":"main.dart.js"',
              f'"mainJsPath":"main.dart.js?v={sha}"',
          )
          bootstrap.write_text(text, encoding="utf-8")
          worker = Path("build/web/flutter_service_worker.js")
          if worker.exists():
              worker.unlink()
          PY

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: flutter_app/build/web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
