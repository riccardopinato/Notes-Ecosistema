name: Android CI

on:
  push:
    branches: [ "main", "v0.26-cloud-core" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify complete source tree
        shell: bash
        run: |
          test -f app/build.gradle.kts
          test -d app/src/main
          test -f gradle/libs.versions.toml
          echo "Complete Android source tree detected."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create CI debug keystore
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Compile instrumentation tests
        run: gradle --no-daemon :app:compileDebugAndroidTestKotlin

      - name: Debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Release compile
        run: gradle --no-daemon :app:compileReleaseKotlin

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Notes-Ecosistema-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Room schemas
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Notes-Ecosistema-room-schemas
          path: app/schemas/it.notes.ecosystem.data.NotesDatabase/*.json
          if-no-files-found: error
          retention-days: 14
