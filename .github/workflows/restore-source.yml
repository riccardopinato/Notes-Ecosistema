name: Restore source tree

on:
  push:
    paths:
      - "Notes-Ecosistema-0.25.0-source.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore canonical source tree
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="Notes-Ecosistema-0.25.0-source.zip"
          if [ ! -f "$ARCHIVE" ]; then
            echo "Archive not present; nothing to restore."
            exit 0
          fi

          # Remove the incorrectly flattened upload while preserving GitHub workflows.
          find . -mindepth 1 -maxdepth 1             ! -name ".git"             ! -name ".github"             ! -name "$ARCHIVE"             -exec rm -rf {} +

          unzip -q -o "$ARCHIVE" -d .
          rm -f "$ARCHIVE"

          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/it/notes/ecosystem/ui/NotesApp.kt
          test -f gradle/libs.versions.toml
          test -d docs
          test -d tools

      - name: Commit restored project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "chore: restore canonical 0.25 source tree"
          git push
