name: Flutter Port CI

on:
  push:
    branches: [ "main", "flutter-port" ]
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-port-ci.yml"
  pull_request:
    branches: [ "main", "flutter-port" ]
    paths:
      - "flutter_app/**"
  workflow_dispatch:
    inputs:
      production_signed:
        description: 'Sign Android release with externally managed key (main only)'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: flutter-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform shell
        shell: bash
        run: |
          rm -rf /tmp/notes_flutter_platform
          flutter create --platforms=android --org it.notes.ecosystem --project-name notes_ecosistema --no-pub /tmp/notes_flutter_platform
          rm -rf android
          cp -R /tmp/notes_flutter_platform/android ./android
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace('applicationId = "it.notes.ecosystem.notes_ecosistema"', 'applicationId = "it.notes.ecosystem.lymlyc"')
          s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 26')
          if 'androidx.work:work-runtime:2.11.2' not in s:
              s += '\n\ndependencies {\n    implementation("androidx.work:work-runtime:2.11.2")\n    implementation("com.google.mlkit:genai-prompt:1.0.0-beta4")\n    implementation("com.google.android.play:ai-delivery:0.1.1-alpha01")\n    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0")\n    implementation("com.tom-roush:pdfbox-android:2.0.27.0")\n}\n'
          else:
              marker = 'implementation("androidx.work:work-runtime:2.11.2")'
              additions = []
              if 'genai-prompt:1.0.0-beta4' not in s:
                  additions.append('implementation("com.google.mlkit:genai-prompt:1.0.0-beta4")')
              if 'ai-delivery:0.1.1-alpha01' not in s:
                  additions.append('implementation("com.google.android.play:ai-delivery:0.1.1-alpha01")')
              if 'kotlinx-coroutines-android:1.11.0' not in s:
                  additions.append('implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0")')
              if 'pdfbox-android:2.0.27.0' not in s:
                  additions.append('implementation("com.tom-roush:pdfbox-android:2.0.27.0")')
              if additions:
                  s = s.replace(marker, marker + '\n    ' + '\n    '.join(additions))
          if 'proguard-rules.pro' not in s:
              s += '\n\nandroid {\n    buildTypes {\n        getByName("release") {\n            isMinifyEnabled = true\n            isShrinkResources = true\n            proguardFiles(\n                getDefaultProguardFile("proguard-android-optimize.txt"),\n                "proguard-rules.pro",\n            )\n        }\n    }\n}\n'
          if 'src/main/cpp/CMakeLists.txt' not in s:
              s += '\n\nandroid {\n    externalNativeBuild {\n        cmake {\n            path = file("src/main/cpp/CMakeLists.txt")\n        }\n    }\n}\n'
          # The PDFBox-Android POM still pins Bouncy Castle 1.72 (2023).
          # Prefer the latest same-artifact-line security maintenance release
          # in every Gradle configuration. CI must validate the upgrade.
          if 'PDF_TOOLBOX_BOUNCY_CASTLE_PIN' not in s:
              s += "\n \n// PDF_TOOLBOX_BOUNCY_CASTLE_PIN: align PDFBox transitive crypto modules.\nconfigurations.configureEach {\n    resolutionStrategy.eachDependency {\n        if (requested.group == \"org.bouncycastle\" &&\n            requested.name.endsWith(\"-jdk15to18\")) {\n            useVersion(\"1.86\")\n            because(\"security maintenance for the PDFBox transitive 1.72 line\")\n        }\n    }\n}\n"
          p.write_text(s)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          ms = manifest.read_text()
          if 'android.permission.INTERNET' not in ms:
              ms = ms.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\\n    <uses-permission android:name="android.permission.INTERNET"/>'
              )
          if 'android.permission.POST_NOTIFICATIONS' not in ms:
              ms = ms.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>'
              )
          if 'android.permission.RECORD_AUDIO' not in ms:
              ms = ms.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>'
              )
          ms = ms.replace(
              'android:launchMode="singleTop"',
              'android:launchMode="singleTop"'
          )
          capture_filters = r'''
                <intent-filter>
                    <action android:name="android.intent.action.SEND"/>
                    <category android:name="android.intent.category.DEFAULT"/>
                    <data android:mimeType="text/plain"/>
                    <data android:mimeType="image/*"/>
                    <data android:mimeType="application/pdf"/>
                </intent-filter>
                <intent-filter>
                    <action android:name="android.intent.action.SEND_MULTIPLE"/>
                    <category android:name="android.intent.category.DEFAULT"/>
                    <data android:mimeType="image/*"/>
                    <data android:mimeType="application/pdf"/>
                </intent-filter>
          '''
          if 'android.intent.action.SEND_MULTIPLE' not in ms:
              ms = ms.replace('</activity>', capture_filters + '\\n            </activity>', 1)
          view_filters = r'''
                <intent-filter>
                    <action android:name="android.intent.action.VIEW"/>
                    <category android:name="android.intent.category.DEFAULT"/>
                    <category android:name="android.intent.category.BROWSABLE"/>
                    <data android:scheme="notes"/>
                </intent-filter>
                <intent-filter>
                    <action android:name="android.intent.action.VIEW"/>
                    <category android:name="android.intent.category.DEFAULT"/>
                    <data android:mimeType="text/plain"/>
                    <data android:mimeType="text/markdown"/>
                    <data android:mimeType="application/pdf"/>
                </intent-filter>
          '''
          if 'android:scheme="notes"' not in ms:
              ms = ms.replace('</activity>', view_filters + '\\n            </activity>', 1)
          widget_receiver = r'''
            <receiver
                android:name=".QuickCaptureWidget"
                android:exported="true">
                <intent-filter>
                    <action android:name="android.appwidget.action.APPWIDGET_UPDATE"/>
                </intent-filter>
                <meta-data
                    android:name="android.appwidget.provider"
                    android:resource="@xml/quick_capture_widget"/>
            </receiver>
          '''
          if 'android.appwidget.action.APPWIDGET_UPDATE' not in ms:
              ms = ms.replace('</application>', widget_receiver + '\\n    </application>')

          attachment_provider = r'''
            <provider
                android:name="androidx.core.content.FileProvider"
                android:authorities="${applicationId}.attachments"
                android:exported="false"
                android:grantUriPermissions="true">
                <meta-data
                    android:name="android.support.FILE_PROVIDER_PATHS"
                    android:resource="@xml/attachment_paths"/>
            </provider>
          '''
          if 'android.support.FILE_PROVIDER_PATHS' not in ms:
              ms = ms.replace('</application>', attachment_provider + '\\n    </application>')

          quick_sync_tile = r'''
            <service
                android:name=".QuickSyncTileService"
                android:exported="true"
                android:icon="@mipmap/ic_launcher"
                android:label="Sincronizza Notes"
                android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                <intent-filter>
                    <action android:name="android.service.quicksettings.action.QS_TILE"/>
                </intent-filter>
            </service>
          '''
          if 'android.service.quicksettings.action.QS_TILE' not in ms:
              ms = ms.replace('</application>', quick_sync_tile + '\\n    </application>')

          manifest.write_text(ms)
          PY
          cp android_overrides/MainActivity.kt android/app/src/main/kotlin/it/notes/ecosystem/notes_ecosistema/MainActivity.kt
          cp android_overrides/PdfToolkitBridge.kt android/app/src/main/kotlin/it/notes/ecosystem/notes_ecosistema/PdfToolkitBridge.kt
          cp android_overrides/LocalLlmBridgeGeminiNano.kt android/app/src/main/kotlin/it/notes/ecosystem/notes_ecosistema/LocalLlmBridge.kt
          cp android_overrides/LocalAiPackBridge.kt android/app/src/main/kotlin/it/notes/ecosystem/notes_ecosistema/LocalAiPackBridge.kt
          cp android_overrides/NeedleRuntimeBridge.kt android/app/src/main/kotlin/it/notes/ecosystem/notes_ecosistema/NeedleRuntimeBridge.kt
          mkdir -p android/app/src/main/cpp
          cp android_overrides/needle_native/CMakeLists.txt android/app/src/main/cpp/CMakeLists.txt
          cp android_overrides/needle_native/needle_jni.cpp android/app/src/main/cpp/needle_jni.cpp
          cp android_overrides/needle_native/needle.h android/app/src/main/cpp/needle.h
          cp android_overrides/QuickCaptureWidget.kt android/app/src/main/kotlin/it/notes/ecosystem/notes_ecosistema/QuickCaptureWidget.kt
          cp android_overrides/QuickSyncTileService.kt android/app/src/main/kotlin/it/notes/ecosystem/notes_ecosistema/QuickSyncTileService.kt
          cp android_overrides/SharedActivityBackgroundWorker.kt android/app/src/main/kotlin/it/notes/ecosystem/notes_ecosistema/SharedActivityBackgroundWorker.kt
          mkdir -p android/app/src/main/res/layout android/app/src/main/res/xml android/app/src/main/res/drawable android/app/src/main/res/values android/app/src/main/res/values-night
          cp android_overrides/res/layout/quick_capture_widget.xml android/app/src/main/res/layout/quick_capture_widget.xml
          cp android_overrides/res/xml/quick_capture_widget.xml android/app/src/main/res/xml/quick_capture_widget.xml
          cp android_overrides/res/xml/attachment_paths.xml android/app/src/main/res/xml/attachment_paths.xml
          cp android_overrides/res/drawable/capture_widget_background.xml android/app/src/main/res/drawable/capture_widget_background.xml
          cp android_overrides/res/values/capture.xml android/app/src/main/res/values/capture.xml
          cp android_overrides/res/values-night/capture.xml android/app/src/main/res/values-night/capture.xml
          cp android_overrides/proguard-rules.pro android/app/proguard-rules.pro

      - name: Fetch pinned Needle Android runtime
        env:
          NEEDLE_TELEMETRY: "0"
          DO_NOT_TRACK: "1"
        run: >-
          python3 tool/fetch_needle_android_runtime.py
          android/app/src/main/cpp/needle_vendor/arm64-v8a/libneedle.a

      - name: Dependencies
        run: flutter pub get

      - name: Verify PDFBox crypto runtime dependency versions
        shell: bash
        run: |
          mkdir -p build
          (cd android && ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon) > build/pdfbox-gradle-runtime.txt
          for module in bcprov-jdk15to18 bcpkix-jdk15to18 bcutil-jdk15to18; do
            if ! grep -Eq "org\\.bouncycastle:${module}:1\\.72 -> 1\\.86|org\\.bouncycastle:${module}:1\\.86" build/pdfbox-gradle-runtime.txt; then
              echo "::error::Runtime dependency ${module} is not pinned to version 1.86"
              exit 1
            fi
          done
          echo "PDFBox runtime Bouncy Castle dependency versions verified."

      - name: Upload PDF Toolbox dependency evidence
        uses: actions/upload-artifact@v4
        with:
          name: Notes-PDF-Toolbox-Gradle-deps
          path: flutter_app/build/pdfbox-gradle-runtime.txt
          if-no-files-found: error
          retention-days: 14

      - name: Format check
        run: |
          dart format lib test
          git diff --exit-code -- lib test

      - name: Show canonical formatter diff
        if: failure()
        run: git diff -- lib test

      - name: Production-signing configurator unit tests
        run: python3 -m unittest discover -s tool -p 'test_release_signing_config.py'

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Tests
        run: flutter test --no-pub

      - name: Build debug APK
        run: flutter build apk --debug --no-pub

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Notes-Ecosistema-Flutter-debug
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # The normal debug/release and Play builds keep PDF Toolbox hidden.
      # An explicit QA APK is generated separately for physical-device testing.
      - name: Build opt-in PDF Toolbox QA APK
        if: (github.event_name == 'workflow_dispatch' && inputs.production_signed != true) || (github.event_name == 'pull_request' && github.event.pull_request.number == 69)
        run: |
          # Isolate QA data and signature from any installed production Notes app.
          cp android/app/build.gradle.kts android/app/build.gradle.kts.before_pdf_qa
          cp android/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml.before_pdf_qa
          trap 'mv android/app/build.gradle.kts.before_pdf_qa android/app/build.gradle.kts; mv android/app/src/main/AndroidManifest.xml.before_pdf_qa android/app/src/main/AndroidManifest.xml' EXIT
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("android/app/build.gradle.kts")
          before = 'applicationId = "it.notes.ecosystem.lymlyc"'
          after = 'applicationId = "it.notes.ecosystem.lymlyc.toolboxqa"'
          content = gradle.read_text()
          assert content.count(before) == 1, "Cannot isolate QA applicationId"
          gradle.write_text(content.replace(before, after))

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          old_label = 'android:label="notes_ecosistema"'
          assert source.count(old_label) == 1, "Cannot isolate QA app label"
          manifest.write_text(source.replace(old_label, 'android:label="Notes PDF QA"'))
          PY
          flutter build apk --debug --no-pub --dart-define=NOTES_ENABLE_PDF_TOOLBOX=true
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/notes-pdf-toolbox-qa-debug.apk

      - name: Upload opt-in PDF Toolbox QA APK and test protocol
        if: (github.event_name == 'workflow_dispatch' && inputs.production_signed != true) || (github.event_name == 'pull_request' && github.event.pull_request.number == 69)
        uses: actions/upload-artifact@v4
        with:
          name: Notes-PDF-Toolbox-QA-debug
          path: |
            flutter_app/build/app/outputs/flutter-apk/notes-pdf-toolbox-qa-debug.apk
            flutter_app/PDF_TOOLBOX_DEVICE_QA.md
          if-no-files-found: error
          retention-days: 14

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION="$(awk '/^version:/{print $2; exit}' pubspec.yaml | cut -d+ -f1)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Push/PR builds are never distributable. Manual signing is main-only.
      - name: Configure protected production signing
        if: github.event_name == 'workflow_dispatch' && inputs.production_signed == true
        shell: bash
        env:
          NOTES_KEYSTORE_B64: ${{ secrets.NOTES_ANDROID_KEYSTORE_BASE64 }}
          NOTES_SIGNING_STORE_PASSWORD: ${{ secrets.NOTES_ANDROID_KEYSTORE_PASSWORD }}
          NOTES_SIGNING_KEY_ALIAS: ${{ secrets.NOTES_ANDROID_KEY_ALIAS }}
          NOTES_SIGNING_KEY_PASSWORD: ${{ secrets.NOTES_ANDROID_KEY_PASSWORD }}
          NOTES_EXPECTED_CERT_SHA256: ${{ secrets.NOTES_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          for key in NOTES_KEYSTORE_B64 NOTES_SIGNING_STORE_PASSWORD NOTES_SIGNING_KEY_ALIAS NOTES_SIGNING_KEY_PASSWORD NOTES_EXPECTED_CERT_SHA256; do
            if [ -z "$(printenv "$key")" ]; then
              echo "::error::Missing protected release signer setting."
              exit 1
            fi
          done
          if ! printf '%s' "$NOTES_EXPECTED_CERT_SHA256" | grep -Eq '^[a-fA-F0-9]{64}$'; then
            echo "::error::Approved cert digest must be 64 hex characters."
            exit 1
          fi
          umask 077
          export NOTES_SIGNING_KEYSTORE_FILE="$RUNNER_TEMP/notes-release-upload.jks"
          printf '%s' "$NOTES_KEYSTORE_B64" | base64 --decode > "$NOTES_SIGNING_KEYSTORE_FILE"
          chmod 600 "$NOTES_SIGNING_KEYSTORE_FILE"
          python3 tool/configure_release_signing.py android/app/build.gradle.kts

      - name: Build release APKs per ABI
        env:
          NOTES_SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/notes-release-upload.jks
          NOTES_SIGNING_STORE_PASSWORD: ${{ (github.event_name == 'workflow_dispatch' && inputs.production_signed == true) && secrets.NOTES_ANDROID_KEYSTORE_PASSWORD || '' }}
          NOTES_SIGNING_KEY_ALIAS: ${{ (github.event_name == 'workflow_dispatch' && inputs.production_signed == true) && secrets.NOTES_ANDROID_KEY_ALIAS || '' }}
          NOTES_SIGNING_KEY_PASSWORD: ${{ (github.event_name == 'workflow_dispatch' && inputs.production_signed == true) && secrets.NOTES_ANDROID_KEY_PASSWORD || '' }}
        run: >
          flutter build apk --release --split-per-abi --no-pub
          --obfuscate --split-debug-info=build/symbols

      - name: Verify and classify APK signing identity
        shell: bash
        env:
          NOTES_EXPECTED_CERT_SHA256: ${{ (github.event_name == 'workflow_dispatch' && inputs.production_signed == true) && secrets.NOTES_ANDROID_CERT_SHA256 || '' }}
        run: |
          set -euo pipefail
          mkdir -p build/release-evidence
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APK_SIGNER"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.production_signed }}" = "true" ]; then
            EXPECTED="$(printf '%s' "$NOTES_EXPECTED_CERT_SHA256" | tr 'A-F' 'a-f')"
            if ! printf '%s' "$EXPECTED" | grep -Eq '^[a-f0-9]{64}$'; then
              echo "::error::Missing trusted production signer digest."
              exit 1
            fi
            CLASSIFICATION="PRODUCTION_SIGNED_CERT_VERIFIED"
          else
            EXPECTED=""
            CLASSIFICATION="CI_ONLY_DEBUG_SIGNED_NOT_FOR_DISTRIBUTION"
          fi
          for APK in build/app/outputs/flutter-apk/app-*-release.apk; do
            test -f "$APK"
            REPORT="$("$APK_SIGNER" verify --print-certs "$APK")"
            # apksigner output can differ in whitespace and colon-delimited
            # fingerprint formatting across Android build-tools versions.
            CERT_LINES="$(printf '%s\n' "$REPORT" | grep -Ei 'Signer #[0-9]+ certificate SHA-256 digest:' || true)"
            CERT_COUNT="$(printf '%s\n' "$CERT_LINES" | grep -Eic 'certificate SHA-256 digest:' || true)"
            CERT="$(printf '%s\n' "$CERT_LINES" | head -1 | sed -E 's/^.*certificate SHA-256 digest:[[:space:]]*//I' | tr -d ':[:space:]' | tr 'A-F' 'a-f')"
            if [ "$CERT_COUNT" != "1" ] || ! printf '%s' "$CERT" | grep -Eq '^[a-f0-9]{64}
            if [ -n "$EXPECTED" ]; then
              if [ "$CERT" != "$EXPECTED" ] || printf '%s\n' "$REPORT" | grep -Fq 'CN=Android Debug'; then
                echo "::error::APK signing certificate does not match approved production certificate."
                exit 1
              fi
            else
              if ! printf '%s\n' "$REPORT" | grep -Fq 'CN=Android Debug'; then
                echo "::error::CI-only release signed by unexpected identity."
                exit 1
              fi
            fi
            printf '%s %s\n' "$(basename "$APK")" "$CERT" >> build/release-evidence/apk-signers.txt
          done
          printf 'signing_classification=%s\n' "$CLASSIFICATION" > build/release-evidence/SIGNING_STATUS.txt

      - name: APK size report and regression guard
        shell: bash
        run: |
          echo "APK prodotti:"
          du -h build/app/outputs/flutter-apk/*.apk | sort -h
          ARM64="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -f "$ARM64"
          BYTES="$(stat -c%s "$ARM64")"
          SOFT_TARGET="$((38 * 1024 * 1024))"
          ACCIDENT_GUARD="$((80 * 1024 * 1024))"
          echo "arm64 bytes: $BYTES / soft target: $SOFT_TARGET"
          if [ "$BYTES" -gt "$SOFT_TARGET" ]; then
            echo "::warning::ARM64 APK exceeds the 38 MiB soft target; review the size increase."
          fi
          if unzip -l "$ARM64" | grep -q 'needle3\.cact'; then
            echo "::error::Needle model weights must never be bundled in the base APK."
            exit 1
          fi
          test "$BYTES" -le "$ACCIDENT_GUARD"

      - name: Materialize Needle 20L Play AI pack
        env:
          NEEDLE_TELEMETRY: "0"
          DO_NOT_TRACK: "1"
        run: |
          mkdir -p android/notes_needle3_20l/src/main/assets
          cp android_plus/notes_needle3_20l/build.gradle android/notes_needle3_20l/build.gradle
          python3 tool/fetch_needle_model.py android/notes_needle3_20l/src/main/assets/needle3.cact
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          ss = settings.read_text()
          if 'include(":notes_needle3_20l")' not in ss:
              ss += '\ninclude(":notes_needle3_20l")\n'
          settings.write_text(ss)

          app = Path("android/app/build.gradle.kts")
          gradle = app.read_text()
          if 'assetPacks += setOf(":notes_needle3_20l")' not in gradle:
              gradle += '\n\nandroid {\n    assetPacks += setOf(":notes_needle3_20l")\n}\n'
          app.write_text(gradle)
          PY

      - name: Build Play AAB with on-demand Needle pack
        env:
          NOTES_SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/notes-release-upload.jks
          NOTES_SIGNING_STORE_PASSWORD: ${{ (github.event_name == 'workflow_dispatch' && inputs.production_signed == true) && secrets.NOTES_ANDROID_KEYSTORE_PASSWORD || '' }}
          NOTES_SIGNING_KEY_ALIAS: ${{ (github.event_name == 'workflow_dispatch' && inputs.production_signed == true) && secrets.NOTES_ANDROID_KEY_ALIAS || '' }}
          NOTES_SIGNING_KEY_PASSWORD: ${{ (github.event_name == 'workflow_dispatch' && inputs.production_signed == true) && secrets.NOTES_ANDROID_KEY_PASSWORD || '' }}
        run: >-
          flutter build appbundle --release --no-pub
          --obfuscate --split-debug-info=build/symbols

      - name: Verify AAB signing certificate
        shell: bash
        env:
          NOTES_EXPECTED_CERT_SHA256: ${{ (github.event_name == 'workflow_dispatch' && inputs.production_signed == true) && secrets.NOTES_ANDROID_CERT_SHA256 || '' }}
        run: |
          set -euo pipefail
          AAB="build/app/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          mkdir -p build/release-evidence
          jarsigner -verify "$AAB" > build/release-evidence/aab-signature-verify.txt
          grep -q 'jar verified' build/release-evidence/aab-signature-verify.txt
          keytool -printcert -jarfile "$AAB" > build/release-evidence/aab-signing-certificate.txt
          CERT="$(sed -n 's/^[[:space:]]*SHA256: //p' build/release-evidence/aab-signing-certificate.txt | head -1 | tr -d ':' | tr 'A-F' 'a-f')"
          if ! printf '%s' "$CERT" | grep -Eq '^[a-f0-9]{64}$'; then
            echo "::error::Unreadable AAB signer certificate."
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.production_signed }}" = "true" ]; then
            EXPECTED="$(printf '%s' "$NOTES_EXPECTED_CERT_SHA256" | tr 'A-F' 'a-f')"
            if [ "$CERT" != "$EXPECTED" ] || grep -Fq 'CN=Android Debug' build/release-evidence/aab-signing-certificate.txt; then
              echo "::error::AAB signing identity does not match approved production certificate."
              exit 1
            fi
          else
