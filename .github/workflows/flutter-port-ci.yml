name: Flutter Port CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-port-ci.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "flutter_app/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      NOTES_RELEASE_STORE_PASSWORD: ${{ secrets.NOTES_ANDROID_STORE_PASSWORD }}
      NOTES_RELEASE_KEY_ALIAS: ${{ secrets.NOTES_ANDROID_KEY_ALIAS }}
      NOTES_RELEASE_KEY_PASSWORD: ${{ secrets.NOTES_ANDROID_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Toolchain fingerprint
        shell: bash
        run: |
          flutter --version
          java -version
          python3 --version

      - name: Generate Android platform shell
        shell: bash
        run: |
          rm -rf /tmp/notes_flutter_platform
          flutter create --platforms=android --org it.notes.ecosystem --project-name notes_ecosistema --no-pub /tmp/notes_flutter_platform
          rm -rf android
          cp -R /tmp/notes_flutter_platform/android ./android
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace('applicationId = "it.notes.ecosystem.notes_ecosistema"', 'applicationId = "it.notes.ecosystem.lymlyc"')
          s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 26')
          if 'androidx.work:work-runtime:2.11.2' not in s:
              s += '\n\ndependencies {\n    implementation("androidx.work:work-runtime:2.11.2")\n}\n'
          if 'proguard-rules.pro' not in s:
              s += '\n\nandroid {\n    signingConfigs {\n        create("release") {\n            storeFile = file(System.getenv("NOTES_RELEASE_KEYSTORE_FILE"))\n            storePassword = System.getenv("NOTES_RELEASE_STORE_PASSWORD")\n            keyAlias = System.getenv("NOTES_RELEASE_KEY_ALIAS")\n            keyPassword = System.getenv("NOTES_RELEASE_KEY_PASSWORD")\n        }\n    }\n    buildTypes {\n        getByName("release") {\n            signingConfig = signingConfigs.getByName("release")\n            isMinifyEnabled = true\n            isShrinkResources = true\n            proguardFiles(\n                getDefaultProguardFile("proguard-android-optimize.txt"),\n                "proguard-rules.pro",\n            )\n        }\n    }\n}\n'
          p.write_text(s)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          ms = manifest.read_text()
          if 'android.permission.INTERNET' not in ms:
              ms = ms.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\\n    <uses-permission android:name="android.permission.INTERNET"/>'
              )
          if 'android.permission.POST_NOTIFICATIONS' not in ms:
              ms = ms.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>'
              )
          if 'android.permission.RECORD_AUDIO' not in ms:
              ms = ms.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>'
              )
          ms = ms.replace(
              'android:launchMode="singleTop"',
              'android:launchMode="singleTop"'
          )
          capture_filters = r'''
                <intent-filter>
                    <action android:name="android.intent.action.SEND"/>
                    <category android:name="android.intent.category.DEFAULT"/>
                    <data android:mimeType="text/plain"/>
                    <data android:mimeType="image/*"/>
                    <data android:mimeType="application/pdf"/>
                </intent-filter>
                <intent-filter>
                    <action android:name="android.intent.action.SEND_MULTIPLE"/>
                    <category android:name="android.intent.category.DEFAULT"/>
                    <data android:mimeType="image/*"/>
                    <data android:mimeType="application/pdf"/>
                </intent-filter>
          '''
          if 'android.intent.action.SEND_MULTIPLE' not in ms:
              ms = ms.replace('</activity>', capture_filters + '\\n            </activity>', 1)
          widget_receiver = r'''
            <receiver
                android:name=".QuickCaptureWidget"
                android:exported="true">
                <intent-filter>
                    <action android:name="android.appwidget.action.APPWIDGET_UPDATE"/>
                </intent-filter>
                <meta-data
                    android:name="android.appwidget.provider"
                    android:resource="@xml/quick_capture_widget"/>
            </receiver>
          '''
          if 'android.appwidget.action.APPWIDGET_UPDATE' not in ms:
              ms = ms.replace('</application>', widget_receiver + '\\n    </application>')

          attachment_provider = r'''
            <provider
                android:name="androidx.core.content.FileProvider"
                android:authorities="${applicationId}.attachments"
                android:exported="false"
                android:grantUriPermissions="true">
                <meta-data
                    android:name="android.support.FILE_PROVIDER_PATHS"
                    android:resource="@xml/attachment_paths"/>
            </provider>
          '''
          if 'android.support.FILE_PROVIDER_PATHS' not in ms:
              ms = ms.replace('</application>', attachment_provider + '\\n    </application>')

          quick_sync_tile = r'''
            <service
                android:name=".QuickSyncTileService"
                android:exported="true"
                android:icon="@mipmap/ic_launcher"
                android:label="Sincronizza Notes"
                android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                <intent-filter>
                    <action android:name="android.service.quicksettings.action.QS_TILE"/>
                </intent-filter>
            </service>
          '''
          if 'android.service.quicksettings.action.QS_TILE' not in ms:
              ms = ms.replace('</application>', quick_sync_tile + '\\n    </application>')
          manifest.write_text(ms)
          PY
          cp android_overrides/MainActivity.kt android/app/src/main/kotlin/it/notes/ecosystem/notes_ecosistema/MainActivity.kt
          cp android_overrides/QuickCaptureWidget.kt android/app/src/main/kotlin/it/notes/ecosystem/notes_ecosistema/QuickCaptureWidget.kt
          cp android_overrides/QuickSyncTileService.kt android/app/src/main/kotlin/it/notes/ecosystem/notes_ecosistema/QuickSyncTileService.kt
          cp android_overrides/SharedActivityBackgroundWorker.kt android/app/src/main/kotlin/it/notes/ecosystem/notes_ecosistema/SharedActivityBackgroundWorker.kt
          mkdir -p android/app/src/main/res/layout android/app/src/main/res/xml android/app/src/main/res/drawable android/app/src/main/res/values android/app/src/main/res/values-night
          cp android_overrides/res/layout/quick_capture_widget.xml android/app/src/main/res/layout/quick_capture_widget.xml
          cp android_overrides/res/xml/quick_capture_widget.xml android/app/src/main/res/xml/quick_capture_widget.xml
          cp android_overrides/res/xml/attachment_paths.xml android/app/src/main/res/xml/attachment_paths.xml
          cp android_overrides/res/drawable/capture_widget_background.xml android/app/src/main/res/drawable/capture_widget_background.xml
          cp android_overrides/res/values/capture.xml android/app/src/main/res/values/capture.xml
          cp android_overrides/res/values-night/capture.xml android/app/src/main/res/values-night/capture.xml
          cp android_overrides/proguard-rules.pro android/app/proguard-rules.pro

      - name: Dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Tests
        run: flutter test --no-pub

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION="$(awk '/^version:/{print $2; exit}' pubspec.yaml | cut -d+ -f1)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure persistent release signing
        shell: bash
        env:
          NOTES_ANDROID_KEYSTORE_BASE64: ${{ secrets.NOTES_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$NOTES_ANDROID_KEYSTORE_BASE64" || {
            echo "::error::Missing NOTES_ANDROID_KEYSTORE_BASE64 repository secret."
            exit 1
          }
          test -n "$NOTES_RELEASE_STORE_PASSWORD" || {
            echo "::error::Missing NOTES_ANDROID_STORE_PASSWORD repository secret."
            exit 1
          }
          test -n "$NOTES_RELEASE_KEY_ALIAS" || {
            echo "::error::Missing NOTES_ANDROID_KEY_ALIAS repository secret."
            exit 1
          }
          test -n "$NOTES_RELEASE_KEY_PASSWORD" || {
            echo "::error::Missing NOTES_ANDROID_KEY_PASSWORD repository secret."
            exit 1
          }
          KEYSTORE="$RUNNER_TEMP/notes-ecosistema-release.jks"
          printf '%s' "$NOTES_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"

          # Fail fast before the expensive release build if any signing
          # credential was copied incorrectly.
          keytool -list             -keystore "$KEYSTORE"             -storepass "$NOTES_RELEASE_STORE_PASSWORD"             -alias "$NOTES_RELEASE_KEY_ALIAS" >/dev/null
          keytool -certreq             -keystore "$KEYSTORE"             -storepass "$NOTES_RELEASE_STORE_PASSWORD"             -alias "$NOTES_RELEASE_KEY_ALIAS"             -keypass "$NOTES_RELEASE_KEY_PASSWORD"             -file "$RUNNER_TEMP/notes-release-preflight.csr" >/dev/null
          rm -f "$RUNNER_TEMP/notes-release-preflight.csr"

          echo "NOTES_RELEASE_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build release APKs per ABI
        run: >
          flutter build apk --release --split-per-abi --no-pub
          --obfuscate --split-debug-info=build/symbols

      - name: Verify release signature
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee build/release-signature.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" build/release-signature.txt

      - name: APK size report and regression gate
        shell: bash
        run: |
          echo "APK prodotti:"
          du -h build/app/outputs/flutter-apk/*.apk | sort -h
          ARM64="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -f "$ARM64"
          BYTES="$(stat -c%s "$ARM64")"
          LIMIT="$((38 * 1024 * 1024))"
          echo "arm64 bytes: $BYTES / budget: $LIMIT"
          test "$BYTES" -le "$LIMIT"

      - name: Enable KVM for Android smoke test
        shell: bash
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android release install, functional smoke, UI and crash gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: >
            python3 flutter_app/tool/android_release_smoke.py
            --apk flutter_app/build/app/outputs/flutter-apk/app-x86_64-release.apk
            --out flutter_app/build/smoke

      - name: Upload Android smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Notes-Ecosistema-Flutter-${{ steps.app_version.outputs.version }}-android-smoke
          path: flutter_app/build/smoke
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare single ARM64 release APK
        shell: bash
        run: |
          mkdir -p build/release
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk             "build/release/Notes-Ecosistema-${{ steps.app_version.outputs.version }}-arm64-v8a.apk"

      - name: Upload ARM64 release APK
        uses: actions/upload-artifact@v4
        with:
          name: Notes-Ecosistema-Flutter-${{ steps.app_version.outputs.version }}-arm64-release
          path: flutter_app/build/release/Notes-Ecosistema-${{ steps.app_version.outputs.version }}-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload obfuscation symbols
        uses: actions/upload-artifact@v4
        with:
          name: Notes-Ecosistema-Flutter-${{ steps.app_version.outputs.version }}-symbols
          path: flutter_app/build/symbols
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: app_version
        working-directory: flutter_app
        shell: bash
        run: |
          VERSION="$(awk '/^version:/{print $2; exit}' pubspec.yaml | cut -d+ -f1)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download verified ARM64 APK
        uses: actions/download-artifact@v4
        with:
          name: Notes-Ecosistema-Flutter-${{ steps.app_version.outputs.version }}-arm64-release
          path: release

      - name: Publish direct APK asset on GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.app_version.outputs.version }}"
          TAG="v$VERSION"
          APK="release/Notes-Ecosistema-$VERSION-arm64-v8a.apk"
          test -f "$APK"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Notes Ecosistema $VERSION" --notes "Release Android ARM64 verificata da CI, smoke test emulatore, logcat e size gate."
          fi
          gh release upload "$TAG" "$APK" --clobber
