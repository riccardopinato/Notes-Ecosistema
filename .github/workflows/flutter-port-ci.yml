        shell: bash
        run: |
          echo "APK prodotti:"
          du -h build/app/outputs/flutter-apk/*.apk | sort -h
          ARM64="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -f "$ARM64"
          BYTES="$(stat -c%s "$ARM64")"
          SOFT_TARGET="$((38 * 1024 * 1024))"
          ACCIDENT_GUARD="$((80 * 1024 * 1024))"
          echo "arm64 bytes: $BYTES / soft target: $SOFT_TARGET"
          if [ "$BYTES" -gt "$SOFT_TARGET" ]; then
            echo "::warning::ARM64 APK exceeds the 38 MiB soft target; review the size increase."
          fi
          if unzip -l "$ARM64" | grep -q 'needle3\.cact'; then
            echo "::error::Needle model weights must never be bundled in the base APK."
