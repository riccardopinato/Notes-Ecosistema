name: Notes Web Browser Storage QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'flutter_app/lib/src/data/web_workspace_storage.dart'
      - 'flutter_app/lib/web_storage_qa_entry.dart'
      - 'tool/browser_workspace_smoke.py'
      - '.github/workflows/browser-storage-qa.yml'
  push:
    branches: [main]
    paths:
      - 'flutter_app/lib/src/data/web_workspace_storage.dart'
      - 'flutter_app/lib/web_storage_qa_entry.dart'
      - 'tool/browser_workspace_smoke.py'
      - '.github/workflows/browser-storage-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notes-browser-storage-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-localstorage:
    # Pinned OS: Playwright 1.55 Chromium does not support Ubuntu 26.04 yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Set up isolated Flutter web shell
        run: |
          flutter create --platforms=web --org it.notes.ecosystem --project-name notes_ecosistema --no-pub /tmp/notes-browser-qa
          rm -rf flutter_app/web
          cp -R /tmp/notes-browser-qa/web flutter_app/web
      - name: Resolve locked dependencies
        working-directory: flutter_app
        run: flutter pub get --enforce-lockfile
      - name: Validate QA-only Flutter code
        working-directory: flutter_app
        run: |
          dart format --output=none --set-exit-if-changed lib/web_storage_qa_entry.dart
          flutter analyze --no-pub lib/web_storage_qa_entry.dart
      - name: Build isolated browser QA target
        working-directory: flutter_app
        run: flutter build web --release --no-pub --target lib/web_storage_qa_entry.dart --base-href "/"
      - name: Install isolated Chromium test tools
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.55.0
          python3 -m playwright install chromium --with-deps
      - name: Browser smoke with synthetic data
        run: |
          python3 -m http.server 8877 --bind 127.0.0.1 --directory flutter_app/build/web > /tmp/notes-web-qa-http.log 2>&1 &
          python3 tool/browser_workspace_smoke.py
      - name: Upload sanitized QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-browser-storage-qa
          path: qa-results/browser-workspace.json
          if-no-files-found: warn
          retention-days: 14
