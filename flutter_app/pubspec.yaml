name: notes_ecosistema
description: Flutter port of Notes Ecosistema. Local-first, private-by-default.
publish_to: "none"
version: 0.25.1+31

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  archive: ^4.3.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_markdown_plus: ^1.0.12
  crypto: ^3.0.6
  file_picker: ^10.3.3
  google_mlkit_document_scanner: ^0.5.0
  google_mlkit_text_recognition: ^0.16.0
  intl: ^0.20.2
  image_picker: ^1.2.3
  path: ^1.9.1
  path_provider: ^2.1.5
  record: ^7.1.1
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
